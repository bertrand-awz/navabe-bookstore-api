[project]
name = "navabe-api"
version = "2.0.0"
description = "REST API for the Navabe bookstore"
authors = [{ name = "Navabe Team" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask>=3.1.0,<4.0.0",
    "flask-restx>=1.3.0,<2.0.0",
    "flask-cors>=5.0.0,<6.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "mysql-connector-python>=9.0.0,<10.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.scripts]
navabe-api = "navabe_api.__main__:main"

[tool.poetry]
packages = [{ include = "navabe_api", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-q --cov=navabe_api --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
